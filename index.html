    <meta name="description" content="কুরবানী সম্পর্কে বিস্তারিত বিধান, আধুনিক নেসাব ক্যালকুলেটর, মাসায়েল ও প্রশ্নোত্তর, যিলহজ মাসের বিশেষ আমল এবং কুরবানীর ইতিহাস।" />

    <!-- Single Page Apps for GitHub Pages route restore -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
